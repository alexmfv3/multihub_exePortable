<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
  <title>Comparteix la pantalla</title>
  <style>
    body { margin: 0; background: #1e1f26; color: #e8e9ef; font: 14px "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 14px 18px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #ffffff14; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    .tab { border: none; background: transparent; color: #9a9db0; padding: 6px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
    .tab.on { background: #2f3240; color: #fff; }
    main { flex: 1; overflow-y: auto; padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; align-content: start; }
    .src { background: #262833; border: 2px solid transparent; border-radius: 10px; padding: 8px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
    .src:hover { border-color: #ffffff30; }
    .src.sel { border-color: #7c6cf0; }
    .src img { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; display: block; }
    .src div { margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    footer { padding: 12px 18px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #ffffff14; }
    footer button { border: 1px solid #ffffff1f; background: #2f3240; color: #fff; border-radius: 8px; padding: 8px 16px; font: inherit; cursor: pointer; }
    footer .go { background: #7c6cf0; border-color: #7c6cf0; font-weight: 600; }
    footer .go:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>Què vols compartir?</h1>
    <button class="tab on" data-t="screen">Pantalla sencera</button>
    <button class="tab" data-t="window">Finestra</button>
  </header>
  <main id="grid"></main>
  <footer>
    <button id="cancel">Cancel·la</button>
    <button id="go" class="go" disabled>Comparteix</button>
  </footer>
  <script src="picker.js"></script>
</body>
</html>
